<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Mark Angel Concina — Full-stack developer</title>
  <desc id="desc">A warm editorial banner in cream, black, vermilion, and mustard with bold typography.</desc>

  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#F3EBD7" stroke-opacity="0.28" stroke-width="2" />
    </pattern>
    <clipPath id="canvas">
      <rect width="1200" height="360" />
    </clipPath>
  </defs>

  <g clip-path="url(#canvas)">
    <rect width="1200" height="360" fill="#F3EBD7" />
    <rect x="0" y="0" width="24" height="360" fill="#E94F37" />
    <rect x="24" y="0" width="8" height="360" fill="#D6A824" />

    <!-- Editorial identity panel -->
    <g transform="translate(70 0)">
      <rect x="0" y="38" width="14" height="14" fill="#E94F37" />
      <text x="28" y="50" fill="#1B1915" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.8">PORTFOLIO / 2026</text>
      <text x="667" y="50" text-anchor="end" fill="#6B6253" font-family="Courier New, monospace" font-size="12" letter-spacing="1.5">KSM—016</text>

      <line x1="0" y1="70" x2="667" y2="70" stroke="#1B1915" stroke-width="2" />

      <text x="-5" y="153" fill="#1B1915" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="80" font-weight="900" letter-spacing="-4">MARK ANGEL</text>
      <text x="-5" y="231" fill="#E94F37" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="80" font-weight="900" letter-spacing="-4">CONCINA</text>

      <line x1="0" y1="256" x2="667" y2="256" stroke="#1B1915" stroke-width="2" />
      <text x="0" y="286" fill="#1B1915" font-family="Courier New, monospace" font-size="16" font-weight="700" letter-spacing="2.2">FULL-STACK DEVELOPER</text>
      <text x="667" y="286" text-anchor="end" fill="#6B6253" font-family="Arial, Helvetica, sans-serif" font-size="15">Ideas, interfaces, systems.</text>
    </g>

    <!-- Printed process strip -->
    <rect x="32" y="320" width="748" height="40" fill="#D6A824" />
    <g fill="#1B1915" font-family="Courier New, monospace" font-size="13" font-weight="700" letter-spacing="1.4">
      <text x="70" y="345">01 / THINK</text>
      <text x="246" y="345">02 / DESIGN</text>
      <text x="434" y="345">03 / BUILD</text>
      <text x="610" y="345">04 / SHIP</text>
    </g>

    <!-- Statement panel -->
    <rect x="780" y="0" width="420" height="360" fill="#1B1915" />
    <rect x="780" y="0" width="18" height="320" fill="url(#hatch)" />
    <rect x="824" y="37" width="318" height="7" fill="#E94F37" />

    <text x="1119" y="266" text-anchor="end" fill="none" stroke="#F3EBD7" stroke-width="2" stroke-opacity="0.12" font-family="Arial Black, Arial, sans-serif" font-size="245" font-weight="900" letter-spacing="-18">16</text>

    <g font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="62" font-weight="900" letter-spacing="-2">
      <text x="824" y="112" fill="#F3EBD7">MAKE</text>
      <text x="824" y="181" fill="#F3EBD7">IT</text>
      <text x="824" y="250" fill="#D6A824">REAL<tspan fill="#E94F37">.</tspan></text>
    </g>

    <line x1="824" y1="279" x2="1142" y2="279" stroke="#F3EBD7" stroke-opacity="0.6" />
    <text x="824" y="304" fill="#F3EBD7" font-family="Courier New, monospace" font-size="12" letter-spacing="1.5">WEB PRODUCTS WITH PERSONALITY</text>
    <rect x="780" y="320" width="420" height="40" fill="#E94F37" />
    <text x="824" y="345" fill="#1B1915" font-family="Courier New, monospace" font-size="13" font-weight="700" letter-spacing="1.4">DESIGNED TO WORK. BUILT TO LAST.</text>
  </g>

  <rect x="2" y="2" width="1196" height="356" fill="none" stroke="#1B1915" stroke-width="4" />
</svg>
