<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Mark Angel Concina — Full-stack developer and creative builder</title>
  <desc id="desc">A dark futuristic profile banner with neon cyan, violet, and pink accents and a small terminal window.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A12" />
      <stop offset="0.55" stop-color="#0D111F" />
      <stop offset="1" stop-color="#11152A" />
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#70E1F5" />
      <stop offset="0.52" stop-color="#7C5CFC" />
      <stop offset="1" stop-color="#FF4ECD" />
    </linearGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#70E1F5" stop-opacity="0.32" />
      <stop offset="1" stop-color="#70E1F5" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pinkGlow">
      <stop offset="0" stop-color="#FF4ECD" stop-opacity="0.24" />
      <stop offset="1" stop-color="#FF4ECD" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#A8B3CF" stroke-opacity="0.055" stroke-width="1" />
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="28" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)" />
    <rect width="1200" height="360" fill="url(#grid)" />
    <circle cx="115" cy="35" r="265" fill="url(#cyanGlow)" />
    <circle cx="1110" cy="340" r="330" fill="url(#pinkGlow)" />

    <path d="M0 319 C210 270 310 372 520 314 S840 252 1200 304" fill="none" stroke="url(#spectrum)" stroke-opacity="0.22" stroke-width="2" />
    <path d="M0 333 C210 284 310 386 520 328 S840 266 1200 318" fill="none" stroke="url(#spectrum)" stroke-opacity="0.08" stroke-width="8" />

    <g opacity="0.7">
      <path d="M50 66H124L146 88H212" fill="none" stroke="#70E1F5" stroke-opacity="0.35" />
      <circle cx="50" cy="66" r="3" fill="#70E1F5" />
      <circle cx="212" cy="88" r="3" fill="#7C5CFC" />
      <path d="M1010 55H1085L1103 73H1160" fill="none" stroke="#FF4ECD" stroke-opacity="0.35" />
      <circle cx="1010" cy="55" r="3" fill="#7C5CFC" />
      <circle cx="1160" cy="73" r="3" fill="#FF4ECD" />
    </g>

    <g transform="translate(62 69)">
      <g transform="translate(0 5)">
        <path d="M6 39 17 12l18 17 18-24 18 24 18-17 11 27z" fill="none" stroke="url(#spectrum)" stroke-width="4" stroke-linejoin="round" filter="url(#softGlow)" />
        <path d="M12 47h82" stroke="url(#spectrum)" stroke-width="4" stroke-linecap="round" />
      </g>

      <text x="0" y="105" fill="#F5F7FF" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="2">MARK ANGEL</text>
      <text x="0" y="153" fill="url(#spectrum)" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="2">CONCINA</text>
      <rect x="1" y="176" width="458" height="3" rx="2" fill="url(#spectrum)" />
      <text x="0" y="210" fill="#A8B3CF" font-family="Consolas, Courier New, monospace" font-size="18" letter-spacing="3">FULL-STACK DEVELOPER</text>
      <text x="0" y="240" fill="#7C879F" font-family="Consolas, Courier New, monospace" font-size="15">idea → interface → production</text>
    </g>

    <g transform="translate(696 67)">
      <rect width="444" height="226" rx="18" fill="#0A0E18" stroke="#34405B" stroke-width="1.5" />
      <rect width="444" height="42" rx="18" fill="#131928" />
      <path d="M0 25v17h444V25" fill="#131928" />
      <circle cx="23" cy="21" r="5" fill="#FF5F57" />
      <circle cx="42" cy="21" r="5" fill="#FEBC2E" />
      <circle cx="61" cy="21" r="5" fill="#28C840" />
      <text x="222" y="27" text-anchor="middle" fill="#667085" font-family="Consolas, Courier New, monospace" font-size="12">mark@creative-lab</text>

      <text x="24" y="77" fill="#70E1F5" font-family="Consolas, Courier New, monospace" font-size="15">$</text>
      <text x="43" y="77" fill="#F5F7FF" font-family="Consolas, Courier New, monospace" font-size="15">whoami</text>
      <text x="24" y="108" fill="#A8B3CF" font-family="Consolas, Courier New, monospace" font-size="14">developer / designer / problem solver</text>

      <text x="24" y="145" fill="#FF4ECD" font-family="Consolas, Courier New, monospace" font-size="15">$</text>
      <text x="43" y="145" fill="#F5F7FF" font-family="Consolas, Courier New, monospace" font-size="15">current_status</text>
      <text x="24" y="176" fill="#A8B3CF" font-family="Consolas, Courier New, monospace" font-size="14">shipping ideas into the real world</text>
      <rect x="24" y="197" width="9" height="14" rx="1" fill="#70E1F5" filter="url(#softGlow)" />
    </g>

    <g fill="#F5F7FF" font-family="Consolas, Courier New, monospace" font-size="12">
      <g transform="translate(697 311)">
        <rect width="83" height="27" rx="13.5" fill="#131928" stroke="#70E1F5" stroke-opacity="0.45" />
        <text x="41.5" y="18" text-anchor="middle">&lt;React /&gt;</text>
      </g>
      <g transform="translate(790 311)">
        <rect width="86" height="27" rx="13.5" fill="#131928" stroke="#7C5CFC" stroke-opacity="0.55" />
        <text x="43" y="18" text-anchor="middle">{ Node.js }</text>
      </g>
      <g transform="translate(886 311)">
        <rect width="102" height="27" rx="13.5" fill="#131928" stroke="#7C5CFC" stroke-opacity="0.55" />
        <text x="51" y="18" text-anchor="middle">PostgreSQL</text>
      </g>
      <g transform="translate(998 311)">
        <rect width="142" height="27" rx="13.5" fill="#131928" stroke="#FF4ECD" stroke-opacity="0.48" />
        <text x="71" y="18" text-anchor="middle">☁ Cloud Native</text>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="url(#spectrum)" stroke-opacity="0.42" stroke-width="2" />
</svg>
